<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Extintor</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f4f8;
            padding: 40px;
        }

        .card {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0a3d62;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #074368;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Editar Extintor #{{ extintor.numero }}</h2>

    <form action="{{ url_for('editar_extintor', numero=extintor.numero|int) }}" method="POST">
        <label>Nueva fecha de vencimiento:</label>
        <input type="date" name="fecha" value="{{ extintor.fecha_vencimiento }}">

        <button type="submit">Guardar cambios</button>
    </form>
    <br>
    <a href="{{ url_for('admin_equipos') }}" style="display:block; text-align:center; color:#666; text-decoration:none;">Cancelar</a>
</div>

</body>
</html>
